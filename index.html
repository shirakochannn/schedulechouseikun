<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日程調整アプリ</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --primary: #0f172a;
            --primary-hover: #334155;
            --border: #e2e8f0;
            --no-text: #991b1b;
            --success-bg: #f0fdf4;
            --success-text: #166534;
            --success-border: #bbf7d0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: var(--primary); }
        p.subtitle { color: var(--text-sub); font-size: 0.875rem; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; }
        input[type="text"], input[type="date"], select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; background: #fff; }
        input:focus, select:focus { border-color: var(--primary); }
        button { background: var(--primary); color: #fff; border: none; padding: 12px 16px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e2e8f0; color: var(--text-main); margin-top: 8px; }
        .btn-secondary:hover { background: #cbd5e1; }
        .date-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .date-input-row button { width: auto; background: var(--no-text); padding: 0 12px; }
        
        .room-header { background: #f1f5f9; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
        .room-header h2 { font-size: 1.25rem; margin-bottom: 4px; }
        .share-box { background: #fff; padding: 10px; border: 1px dashed var(--border); border-radius: 8px; font-size: 0.8rem; word-break: break-all; margin-top: 10px; color: var(--text-sub); user-select: all; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.85rem; }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: center; }
        th { background: #f8fafc; font-weight: 600; }
        td.date-col { text-align: left; font-weight: 500; width: 25%; }
        .time-text { font-size: 0.8rem; color: var(--text-main); }
        
        .summary-box { background: var(--success-bg); border: 1px solid var(--success-border); padding: 14px; border-radius: 10px; margin-top: 20px; }
        .summary-box h3 { font-size: 1rem; color: var(--success-text); margin-bottom: 8px; }
        .summary-item { font-size: 0.9rem; margin-bottom: 4px; color: var(--success-text); }

        .hidden { display: none !important; }
        .mt-2 { margin-top: 12px; }
    </style>
</head>
<body>

<div class="container">
    <!-- ホーム画面 -->
    <div id="view-create">
        <h1>日程調整を作成</h1>
        <p class="subtitle">タイトルを設定して、専用のURLを発行します。</p>
        
        <div class="form-group">
            <label>イベント名・タイトル</label>
            <input type="text" id="event-title" placeholder="例：バンド練習、ミーティング">
        </div>

        <div class="form-group">
            <label>候補日（日付）</label>
            <div id="date-inputs">
                <div class="date-input-row">
                    <input type="date" class="candidate-date">
                </div>
            </div>
            <button type="button" class="btn-secondary" onclick="addDateInput()">＋ 候補日を追加</button>
        </div>

        <button onclick="createRoom()" class="mt-2">調整ページを作成する</button>
    </div>

    <!-- ルーム画面 -->
    <div id="view-room" class="hidden">
        <div class="room-header">
            <h2 id="display-title"></h2>
            <p class="subtitle" style="margin-bottom:0;">メンバーの時間帯調整ページ（回答はブラウザに保存されます）</p>
            <div class="share-box" id="display-url" title="クリックしてコピー"></div>
        </div>

        <div class="form-group">
            <label>あなたのお名前</label>
            <input type="text" id="user-name" placeholder="例：山田">
        </div>

        <div style="overflow-x: auto;">
            <table id="result-table"></table>
        </div>

        <div id="summary-area"></div>

        <div id="dynamic-input-area" class="mt-2"></div>

        <button onclick="saveMyAnswer()" class="mt-2">回答を保存する</button>
        <button onclick="backToHome()" class="btn-secondary">新しい調整を自分で作る</button>
    </div>
</div>

<script>
    // データを保存するキー（URLのroomパラメータを固有IDとして使用）
    let currentRoomKey = null;

    window.addEventListener('DOMContentLoaded', function() {
        checkRoute();
    });

    function getRoomId() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('room');
    }

    function checkRoute() {
        const roomId = getRoomId();
        if (roomId) {
            currentRoomKey = 'schedule_data_' + roomId;
            loadRoom();
        } else {
            showCreateView();
        }
    }

    function addDateInput() {
        const container = document.getElementById('date-inputs');
        const row = document.createElement('div');
        row.className = 'date-input-row';
        row.innerHTML = `<input type="date" class="candidate-date"> <button type="button" onclick="this.parentElement.remove()">×</button>`;
        container.appendChild(row);
    }

    function createRoom() {
        const titleInput = document.getElementById('event-title');
        const title = titleInput ? titleInput.value.trim() : '';

        if (!title) {
            alert('イベント名・タイトルを入力してください');
            if (titleInput) titleInput.focus();
            return;
        }

        const dateInputs = document.querySelectorAll('.candidate-date');
        const dates = [];
        dateInputs.forEach(input => {
            if (input && input.value) {
                dates.push(input.value);
            }
        });

        if (dates.length === 0) {
            dates.push(new Date().toISOString().split('T')[0]);
        }

        // ランダムなルームIDを生成
        const roomId = Math.random().toString(36).substring(2, 9) + Date.now().toString(36);
        const roomKey = 'schedule_data_' + roomId;

        const roomData = {
            title: title,
            dates: dates,
            answers: {}
        };

        try {
            // ① まず自分のブラウザにこのイベントの土台（タイトルと日付）を保存する
            localStorage.setItem(roomKey, JSON.stringify(roomData));
            
            // ② そのルームIDを含んだURLに移動する
            const newUrl = window.location.protocol + '//' + window.location.host + window.location.pathname + '?room=' + roomId;
            window.location.href = newUrl;
        } catch (err) {
            alert('保存に失敗しました: ' + err.message);
        }
    }

    function loadRoom() {
        const dataJson = localStorage.getItem(currentRoomKey);
        
        if (!dataJson) {
            // 【重要】もし別の人のスマホなどでリンクを開いてデータがない場合、
            // URLからタイトルや日付を復元できるようにするか、新規作成画面に誘導します。
            // ここではURLパラメータから簡易復元を試みるか、エラーを出します。
            alert('この調整ページのデータがこの端末にありません。\n※別の端末で作られた調整ページを他の方が閲覧する場合、現在の仕様では作成者と同じ端末・環境でないと予定表の土台が共有されません。');
            window.location.search = '';
            showCreateView();
            return;
        }

        const room = JSON.parse(dataJson);
        document.getElementById('display-title').innerText = room.title;
        const shareUrl = window.location.href;
        const urlBox = document.getElementById('display-url');
        urlBox.innerText = shareUrl;
        urlBox.onclick = function() {
            navigator.clipboard.writeText(shareUrl);
            alert('URLをコピーしました！');
        };

        renderTable(room);
        renderSummary(room);
        renderInputControls(room);

        document.getElementById('view-create').classList.add('hidden');
        document.getElementById('view-room').classList.remove('hidden');
    }

    function generateTimeOptions(selectedValue) {
        let html = '<option value="不可">× 不可</option>';
        for (let h = 8; h <= 24; h++) {
            for (let m = 0; m < 60; m += 30) {
                if (h === 24 && m > 0) continue;
                const timeStr = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
                const selected = (timeStr === selectedValue) ? 'selected' : '';
                html += `<option value="${timeStr}" ${selected}>${timeStr}</option>`;
            }
        }
        return html;
    }

    function renderTable(room) {
        const table = document.getElementById('result-table');
        let html = '<tr><th>候補日</th>';

        const names = Object.keys(room.answers);
        names.forEach(name => {
            html += `<th>${escapeHtml(name)}</th>`;
        });
        html += '</tr>';

        room.dates.forEach((dateStr, dateIdx) => {
            const formattedDate = formatDate(dateStr);
            html += `<tr><td class="date-col">${formattedDate}</td>`;

            names.forEach(name => {
                const ans = room.answers[name] && room.answers[name][dateIdx];
                let displayStr = '未回答';
                if (ans) {
                    if (ans.type === 'ng') {
                        displayStr = '<span style="color:var(--no-text); font-weight:bold;">×</span>';
                    } else if (ans.type === 'time') {
                        displayStr = `${ans.start} ～ ${ans.end}`;
                    }
                }
                html += `<td class="time-text">${displayStr}</td>`;
            });

            html += '</tr>';
        });

        table.innerHTML = html;
    }

    function renderSummary(room) {
        const summaryArea = document.getElementById('summary-area');
        const names = Object.keys(room.answers);

        if (names.length === 0) {
            summaryArea.innerHTML = '';
            return;
        }

        let summaryHtml = `<div class="summary-box"><h3>✨ 自動集計（全員共通で空いている時間）</h3>`;

        room.dates.forEach((dateStr, dateIdx) => {
            let latestStart = null;
            let earliestEnd = null;
            let allAvailable = true;

            names.forEach(name => {
                const ans = room.answers[name] ? room.answers[name][dateIdx] : null;
                if (!ans || ans.type === 'ng') {
                    allAvailable = false;
                } else {
                    if (!latestStart || ans.start > latestStart) latestStart = ans.start;
                    if (!earliestEnd || ans.end < earliestEnd) earliestEnd = ans.end;
                }
            });

            const formattedDate = formatDate(dateStr);

            if (allAvailable && names.length > 0 && latestStart && earliestEnd && latestStart < earliestEnd) {
                summaryHtml += `<div class="summary-item">・<strong>${formattedDate}</strong>： ${latestStart} ～ ${earliestEnd} が全員OK！</div>`;
            } else {
                summaryHtml += `<div class="summary-item" style="color:var(--text-sub);">・<strong>${formattedDate}</strong>： 全員が重なる時間帯はありません</div>`;
            }
        });

        summaryHtml += `</div>`;
        summaryArea.innerHTML = summaryHtml;
    }

    function renderInputControls(room) {
        const area = document.getElementById('dynamic-input-area');
        let html = '<label style="margin-bottom:8px; font-weight:600; font-size:0.875rem;">あなたの時間帯を選択</label>';
        
        room.dates.forEach((dateStr, idx) => {
            html += `<div style="background:#f8fafc; padding:10px; border-radius:8px; border:1px solid var(--border); margin-bottom:8px;">
                <div style="font-size:0.85rem; font-weight:600; margin-bottom:6px;">${formatDate(dateStr)}</div>
                <div style="display:flex; align-items:center; gap:6px;">
                    <select id="start-${idx}" onchange="checkTimeState(${idx})" style="font-size:0.85rem; padding:6px;">
                        ${generateTimeOptions('09:00')}
                    </select>
                    <span style="font-size:0.85rem;">～</span>
                    <select id="end-${idx}" style="font-size:0.85rem; padding:6px;">
                        ${generateTimeOptions('21:00')}
                    </select>
                </div>
            </div>`;
        });
        area.innerHTML = html;
    }

    function checkTimeState(idx) {
        const startVal = document.getElementById(`start-${idx}`).value;
        const endSelect = document.getElementById(`end-${idx}`);
        if (startVal === '不可') {
            endSelect.value = '不可';
        } else if (endSelect.value === '不可') {
            endSelect.value = '21:00';
        }
    }

    function saveMyAnswer() {
        const nameInput = document.getElementById('user-name');
        const name = nameInput.value.trim();
        if (!name) {
            alert('お名前を入力してください');
            nameInput.focus();
            return;
        }

        const dataJson = localStorage.getItem(currentRoomKey);
        if (!dataJson) return;
        const room = JSON.parse(dataJson);

        if (!room.answers[name]) {
            room.answers[name] = {};
        }

        room.dates.forEach((_, idx) => {
            const start = document.getElementById(`start-${idx}`).value;
            const end = document.getElementById(`end-${idx}`).value;

            if (start === '不可' || end === '不可' || start >= end) {
                room.answers[name][idx] = { type: 'ng' };
            } else {
                room.answers[name][idx] = { type: 'time', start: start, end: end };
            }
        });

        localStorage.setItem(currentRoomKey, JSON.stringify(room));

        alert('回答を保存しました！');
        loadRoom();
    }

    function backToHome() {
        window.location.href = window.location.pathname;
    }

    function showCreateView() {
        document.getElementById('view-room').classList.add('hidden');
        document.getElementById('view-create').classList.remove('hidden');
    }

    function formatDate(dateString) {
        const d = new Date(dateString + 'T00:00:00');
        if (isNaN(d)) return dateString;
        const month = d.getMonth() + 1;
        const day = d.getDate();
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        const dayOfWeek = days[d.getDay()];
        return `${month}/${day}(${dayOfWeek})`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"]/g, function(match) {
            const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
            return escape[match] || match;
        });
    }
</script>

</body>
</html>
